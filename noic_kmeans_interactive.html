<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOIC · K-Means</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
  <style>
    :root {
      color-scheme: light;
      font-family: 'Inter', sans-serif;
      color: #111;
      background: #fff;
      --muted: #555;
      --blue: #007cba;
      --warm: #f8f7f5;
      --grid: #e8e6e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #fff; color: #111; padding: 24px; max-width: 700px; margin: 0 auto; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field span, .slider-group label { font-size: .85rem; font-weight: 500; color: #333; }
    select { width: 100%; min-height: 36px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #111; font: inherit; }
    .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; }
    button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border: 1.5px solid var(--blue); border-radius: 6px; background: var(--blue); color: #fff; font: 500 .85rem 'Inter', sans-serif; cursor: pointer; transition: background .15s; }
    button:hover { background: #006aa3; border-color: #006aa3; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #007cba66; outline-offset: 2px; }
    .shuffle { font-size: 16px; line-height: 1; }
    .plot-frame { width: 100%; height: 320px; margin-bottom: 12px; overflow: hidden; border-radius: 10px; background: var(--warm); }
    canvas { display: block; width: 100%; height: 100%; border-radius: 10px; background: var(--warm); }
    .slider-group { display: flex; grid-column: 1 / -1; flex-direction: column; gap: 4px; margin-top: 4px; }
    .slider-group .row { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; margin: 0; accent-color: var(--blue); }
    .epoch-count { min-width: 62px; font: .95rem 'Computer Modern Serif', 'CMU Serif', serif; text-align: right; }
    .hint { margin-top: 12px; color: #555; font-size: .8rem; text-align: center; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .plot-frame { height: 280px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="controls" aria-label="Controles do gráfico">
      <label class="field">
        <span>Logo</span>
        <select id="logo-select">
          <option value="original">Original</option>
          <option value="variant">Variante com lápis</option>
        </select>
      </label>
      <label class="field">
        <span>Densidade</span>
        <select id="density-select">
          <option value="standard">Padrão</option>
          <option value="compact">Compacta</option>
        </select>
      </label>
      <div class="slider-group">
        <label for="epoch-slider">Época</label>
        <div class="row">
          <input id="epoch-slider" type="range" min="0" max="1" value="0" step="1" aria-label="Selecionar época do K-Means">
          <span class="epoch-count" id="epoch-count">0 / 0</span>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button id="randomize" type="button"><span class="shuffle" aria-hidden="true">↻</span> Randomizar os 4 Xs</button>
    </div>

    <div class="plot-frame" id="plot-frame">
      <canvas id="plot" role="img" aria-label="Nuvem de pontos do logo NOIC e quatro centros do K-Means"></canvas>
    </div>
    <p class="hint">A cor de cada ponto corresponde ao X mais próximo no plano XY. Arraste o controle para percorrer as épocas.</p>
  </main>

        const stable = !hadEmptyCluster && nextLabels.every((label, index) => label === labels[index]);
        centers = updated;
        if (!hadEmptyCluster && (stable || movement < 1e-7)) break;
        labels = nextLabels;
      }
      return steps;
    }

    function colorsFromFinalResult(labels, dataset) {
      const counts = Array.from({ length: CLUSTER_COUNT }, () => new Array(CLUSTER_COUNT).fill(0));
      labels.forEach((cluster, index) => counts[cluster][dataset.points[index].letter]++);
      let bestScore = -1;
      let bestMapping = [];
      function search(cluster, used, mapping, score) {
        if (cluster === CLUSTER_COUNT) {
          if (score > bestScore) { bestScore = score; bestMapping = mapping.slice(); }
          return;
        }
        for (let letter = 0; letter < CLUSTER_COUNT; letter++) {
          if (!used.has(letter)) {
            used.add(letter);
            mapping.push(letter);
            search(cluster + 1, used, mapping, score + counts[cluster][letter]);
            mapping.pop();
            used.delete(letter);
          }
        }
      }
      search(0, new Set(), [], 0);
      if (bestMapping.length !== CLUSTER_COUNT || new Set(bestMapping).size !== CLUSTER_COUNT) {
        throw new Error("Falha ao associar as cores aos clusters finais.");
      }
      return bestMapping;
    }

    function setEpoch(index) {
      const step = history[index];
      if (!step || !data) return;
      epochCount.textContent = `${index} / ${history.length - 1}`;
      slider.setAttribute("aria-valuetext", `Época ${index} de ${history.length - 1}`);
      draw(step);
    }

    function drawX(x, y, color, size) {
      const path = () => {
        ctx.beginPath();
        ctx.moveTo(x - size, y - size);
        ctx.lineTo(x + size, y + size);
        ctx.moveTo(x + size, y - size);
        ctx.lineTo(x - size, y + size);
      };
      ctx.lineCap = "round";
      path(); ctx.strokeStyle = "#fff"; ctx.lineWidth = size * 0.78; ctx.stroke();
      path(); ctx.strokeStyle = color; ctx.lineWidth = size * 0.5; ctx.stroke();
      path(); ctx.strokeStyle = "#111318"; ctx.lineWidth = size * 0.3; ctx.stroke();
    }

    function draw(step) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#f8f7f5";
      ctx.fillRect(0, 0, rect.width, rect.height);

      const padding = 24;
      const scale = Math.min((rect.width - padding * 2) / data.width, (rect.height - padding * 2) / data.height);
      const offsetX = (rect.width - data.width * scale) / 2;
      const offsetY = (rect.height - data.height * scale) / 2;
      const radius = densitySelect.value === "compact" ? 1.8 : 1.38;
      for (let i = 0; i < data.points.length; i++) {
        const point = data.points[i];
        const cluster = step.labels[i];
        const rgb = data.colors[clusterColorMap[cluster]];
        ctx.fillStyle = `rgb(${rgb[0]} ${rgb[1]} ${rgb[2]})`;
        ctx.beginPath();
        ctx.arc(offsetX + point.x * scale, offsetY + (data.height - point.y) * scale, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      step.centers.forEach((center, cluster) => {
        const x = offsetX + center[0] * scale;
        const y = offsetY + (data.height - center[1]) * scale;
        const rgb = data.colors[clusterColorMap[cluster]];
        drawX(x, y, `rgb(${rgb[0]} ${rgb[1]} ${rgb[2]})`, 9.5);
      });
    }

    function randomize() {
      const raw = DATA[currentKey()];
      data = prepare(raw);
      history = runKMeans(data, randomCenters(data));
      clusterColorMap = colorsFromFinalResult(history[history.length - 1].labels, data);
      slider.min = "0";
      slider.max = String(history.length - 1);
      slider.value = "0";
      setEpoch(0);
    }

    document.getElementById("randomize").addEventListener("click", randomize);
    logoSelect.addEventListener("change", randomize);
    densitySelect.addEventListener("change", randomize);
    slider.addEventListener("input", () => setEpoch(Number(slider.value)));
    window.addEventListener("resize", () => setEpoch(Number(slider.value)));
    randomize();
    slider.value = slider.max;
    setEpoch(Number(slider.value));
  </script>
</body>
</html>
